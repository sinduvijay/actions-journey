name: secondjob
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: first step
        run: echo " hi " > app.txt
      - name: second step
        uses: actions/upload-artifact@v4
        with: 
          name: app-package
          path: app.txt
  verify:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: first step
        uses: actions/download-artifact@v4
        with: 
          name: app-package
      - name: second step
        run: test -f app.txt
