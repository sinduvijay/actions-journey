name: Inspect Runner and Repo

on: push

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Print kernel details and repository files
        run: |
          uname -a
          ls -la
          find . -not -path '*/.*' | sort

      - name: Count files in repository
        run: |
          count=$(find . -type f -not -path '*/.*' | wc -l)
          echo "Total repository files: $count"
